<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | AuditAgent.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      width: 100%;
      font-family: 'Outfit', sans-serif;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      /* Dreamy Pastel Holographic Aura Background matching Canva Slide */
      background-color: #f1f5f9;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(217, 249, 157, 0.85) 0%, transparent 42%),
        radial-gradient(circle at 88% 16%, rgba(251, 207, 232, 0.9) 0%, transparent 44%),
        radial-gradient(circle at 50% 45%, rgba(233, 213, 255, 0.8) 0%, transparent 55%),
        radial-gradient(circle at 14% 86%, rgba(186, 230, 253, 0.95) 0%, transparent 46%),
        radial-gradient(circle at 86% 82%, rgba(167, 243, 208, 0.85) 0%, transparent 45%),
        radial-gradient(circle at 72% 48%, rgba(254, 240, 138, 0.75) 0%, transparent 38%),
        linear-gradient(135deg, #e0f2fe 0%, #ede9fe 48%, #fce7f3 100%);
      background-attachment: fixed;
      padding: 32px 24px;
    }

    /* Ambient animated aura glow overlay */
    body::before {
      content: '';
      position: absolute;
      inset: -20%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.35) 0%, transparent 60%);
      pointer-events: none;
      z-index: 1;
      animation: auraPulse 14s ease-in-out infinite alternate;
    }

    @keyframes auraPulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      50% { transform: scale(1.08) translate(-2%, 2%); opacity: 0.95; }
      100% { transform: scale(1) translate(1%, -1%); opacity: 0.7; }
    }

    /* Top Navigation */
    .top-nav {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
      margin-bottom: 20px;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(100, 116, 139, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.9);
      text-decoration: none;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.96rem;
      letter-spacing: -0.01em;
    }

    .brand-glyph {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7047eb, #8b5cf6);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      color: #334155;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 2px 10px rgba(100, 116, 139, 0.06);
    }

    .btn-nav:hover {
      background: #ffffff;
      color: #0f172a;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(100, 116, 139, 0.12);
    }

    .btn-nav.primary {
      background: #0f172a;
      color: #ffffff;
      border: 1px solid #0f172a;
    }

    .btn-nav.primary:hover {
      background: #1e293b;
      color: #ffffff;
    }

    /* Main Container */
    .hero-center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 720px;
      width: 100%;
      margin: auto 0;
      padding: 20px 0;
    }

    /* Heading matching Canva Slide */
    .thank-you-title {
      font-size: clamp(2.6rem, 5vw, 4rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.025em;
      color: #1e293b;
      margin-bottom: 38px;
    }

    .thank-you-title strong {
      font-weight: 600;
    }

    /* White Rounded Contact Card matching Canva Slide */
    .contact-card-wrap {
      position: relative;
      width: 100%;
      max-width: 520px;
    }

    .white-card {
      background: #ffffff;
      border-radius: 36px;
      padding: 44px 48px;
      box-shadow: 
        0 24px 60px -15px rgba(100, 116, 139, 0.18),
        0 8px 24px -6px rgba(100, 116, 139, 0.08),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      position: relative;
      text-align: left;
      z-index: 2;
    }

    .contact-info-list {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .contact-info-row {
      display: grid;
      grid-template-columns: 85px 1fr;
      align-items: center;
      font-size: 1.15rem;
      letter-spacing: -0.015em;
    }

    .contact-label {
      color: #1e293b;
      font-weight: 500;
      font-size: 1.15rem;
    }

    .contact-value {
      color: #334155;
      font-weight: 400;
      font-size: 1.15rem;
      text-decoration: none;
      word-break: break-word;
    }

    .contact-value:hover {
      color: #7047eb;
    }

    .social-icons-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .social-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      color: #1e293b;
      text-decoration: none;
      font-size: 1.25rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .social-icon-btn:hover {
      color: #7047eb;
      transform: scale(1.15);
    }

    /* 3D Floating Cloud matching Canva Slide bottom-right position */
    .floating-cloud-3d {
      position: absolute;
      right: -45px;
      bottom: -35px;
      width: 170px;
      height: auto;
      z-index: 5;
      pointer-events: none;
      filter: drop-shadow(0 18px 25px rgba(100, 116, 139, 0.25));
      animation: cloudFloat 6s ease-in-out infinite alternate;
    }

    @keyframes cloudFloat {
      0% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-10px) rotate(1.5deg);
      }
      100% {
        transform: translateY(2px) rotate(-1deg);
      }
    }

    /* Secondary actions inside card */
    .card-actions-divider {
      margin: 28px 0 20px 0;
      height: 1px;
      background: #f1f5f9;
    }

    .card-bottom-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-action-primary {
      flex: 1;
      min-width: 180px;
      background: linear-gradient(135deg, #7047eb, #8b5cf6);
      color: #ffffff;
      text-align: center;
      padding: 12px 18px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(112, 71, 235, 0.3);
      transition: all 0.2s ease;
    }

    .btn-action-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(112, 71, 235, 0.4);
    }

    .btn-action-secondary {
      flex: 1;
      min-width: 140px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #475569;
      text-align: center;
      padding: 12px 18px;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-action-secondary:hover {
      background: #f1f5f9;
      color: #1e293b;
    }

    /* Footer */
    .page-footer {
      position: relative;
      z-index: 10;
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 24px;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .white-card {
        padding: 32px 24px;
        border-radius: 28px;
      }
      .floating-cloud-3d {
        right: -15px;
        bottom: -25px;
        width: 125px;
      }
      .contact-info-row {
        grid-template-columns: 75px 1fr;
        font-size: 1rem;
      }
      .contact-label, .contact-value {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-nav">
    <a href="/landing.html" class="brand-pill">
      <div class="brand-glyph">A</div>
      <span>AuditAgent.ai</span>
    </a>

    <div class="nav-buttons">
      <a href="/landing.html" class="btn-nav">Product Overview</a>
      <a href="/" class="btn-nav primary">Recruiter Workspace →</a>
    </div>
  </header>

  <!-- Main Hero Center with Canva Slide Recreation -->
  <main class="hero-center">
    <h1 class="thank-you-title">
      We’d love to<br>hear from you
    </h1>

    <div class="contact-card-wrap">
      <div class="white-card">
        <div class="contact-info-list">
          <div class="contact-info-row">
            <span class="contact-label">Phone</span>

          </div>

          <div class="contact-info-row">
            <span class="contact-label">Email</span>
            <a href="mailto:hello@auditagent.ai" class="contact-value">hello@reallygreatsite.com</a>
          </div>

          <div class="contact-info-row">
            <span class="contact-label">Social</span>
            <div class="social-icons-group">
              <!-- Facebook -->
              <a href="https://facebook.com" target="_blank" rel="noopener" class="social-icon-btn" title="Facebook">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M22.675 0h-21.35C.597 0 0 .597 0 1.326v21.348C0 23.403.597 24 1.326 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.73 0 1.325-.597 1.325-1.326V1.326C24 .597 23.405 0 22.675 0z"/>

                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">

                </svg>
              </a>
              <!-- Instagram -->
              <a href="https://instagram.com" target="_blank" rel="noopener" class="social-icon-btn" title="Instagram">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
              </a>
            </div>
          </div>
        </div>

        <div class="card-actions-divider"></div>

        <div class="card-bottom-actions">
          <a href="/" class="btn-action-primary">Return to Recruiter Workspace →</a>
          <a href="/landing.html" class="btn-action-secondary">Landing Page</a>
        </div>
      </div>

      <!-- 3D Cloud Floating Accent -->
      <img src="/static/cloud_3d.png" alt="3D Cloud" class="floating-cloud-3d">
    </div>
  </main>

  <!-- Footer -->
  <footer class="page-footer">
    <p>© 2026 AuditAgent.ai — AI advises. Evidence explains. Recruiters decide.</p>
  </footer>

</body>
</html>
